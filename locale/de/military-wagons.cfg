[entity-description]
gun-turret-wagon=Drei Maschinengewehre auf dem Dach. Sie schießen wie Geschütztürme, auch während der Zug fährt. Lege Magazine in den Waggon, die MGs laden aus seiner Ladung nach.
flamethrower-turret-wagon=Zwei Flammenwerfer auf dem Dach. Sie brennen wie Flammenwerfertürme, auch während der Zug fährt. Fülle den Waggon mit Rohöl, Schweröl oder Leichtöl.
rocket-turret-wagon=Zwei Raketenwerfer auf dem Dach. Sie feuern wie Raketentürme, auch während der Zug fährt. Lege Raketen in den Waggon, die Werfer laden aus seiner Ladung nach.

