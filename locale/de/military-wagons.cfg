[technology-description]
gun-turret-wagon=Ein Güterwaggon mit drei Maschinengewehren, die den Zug unterwegs verteidigen.
flamethrower-turret-wagon=Ein Flüssigkeitswaggon mit zwei Flammenwerfern, die den Zug unterwegs verteidigen.
rocket-turret-wagon=Ein Güterwaggon mit zwei Raketenwerfern, die den Zug unterwegs verteidigen.
armor-steel=Stahl mit Kupfer und Kohlenstoff legiert und in Wasser abgeschreckt. Wird für Panzerplatten an Militär-Waggons gebraucht.
composite-armor-plate=Platten aus Panzerstahl für das Ausrüstungsgitter der Militär-Waggons. Sie schützen gegen physischen Schaden.
twin-cannon-wagon=Ein Güterwaggon mit zwei Panzertürmen, die den Zug unterwegs verteidigen.
howitzer-wagon=Ein Güterwaggon mit einer weitreichenden Haubitze, die den Zug unterwegs verteidigt.
mine-launcher-wagon=Ein Waggon, der aus der Ferne Minenfelder legt, dorthin, wohin die Fernsteuerung zeigt.
reactive-armor-plate=Panzerplatten für Militär-Waggons gegen Explosionen, auch die der eigenen Raketen.
acid-armor-plate=Panzerplatten für Militär-Waggons gegen Spucker und Würmer.
fire-armor-plate=Panzerplatten für Militär-Waggons gegen Feuer.
tungsten-armor-plates=Panzerplatten aus Wolframkarbid und Wolframstahl für Militär-Waggons: deutlich stärker als die Stahlplatten.

