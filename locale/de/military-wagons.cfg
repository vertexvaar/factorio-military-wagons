military-wagons-flamethrower-turret-wagon=Aus: Den Waggon, sein Rezept und seine Forschung gibt es nicht. Waggons dieser Art, die schon auf der Karte stehen, werden beim Laden entfernt.
military-wagons-rocket-turret-wagon=Aus: Den Waggon, sein Rezept und seine Forschung gibt es nicht. Waggons dieser Art, die schon auf der Karte stehen, werden beim Laden entfernt.
military-wagons-twin-cannon-wagon=Aus: Den Waggon, sein Rezept und seine Forschung gibt es nicht. Waggons dieser Art, die schon auf der Karte stehen, werden beim Laden entfernt.
military-wagons-howitzer-wagon=Aus: Den Waggon, sein Rezept und seine Forschung gibt es nicht. Waggons dieser Art, die schon auf der Karte stehen, werden beim Laden entfernt.
military-wagons-mine-launcher-wagon=Aus: Den Waggon, seine Munition, Fernsteuerung, Rezepte und Forschung gibt es nicht. Waggons dieser Art, die schon auf der Karte stehen, werden beim Laden entfernt.

[item-description]
armor-steel=Abgeschreckter Stahl mit Kupfer und Kohlenstoff. Grundstoff der Panzerplatten für Militär-Waggons.
wagon-mine=Eine Landmine mit Treibladung für den Minenwerfer-Waggon. Sie landet scharf.
mine-launcher-remote=Auf die Karte oder den Boden klicken: Ein Minenwerfer-Waggon in Reichweite wirft dort eine Mine hin.
composite-armor-plate=Gegen physischen Schaden: 1 flach, 5 % je Platte. Kommt ins Ausrüstungsgitter eines Militär-Waggons; mehrere Platten addieren sich, höchstens 80 %.
reactive-armor-plate=Gegen Explosionen: 3 flach, 6 % je Platte. Kommt ins Ausrüstungsgitter eines Militär-Waggons; mehrere Platten addieren sich, höchstens 80 %.
acid-armor-plate=Gegen Säure: 1 flach, 6 % je Platte. Kommt ins Ausrüstungsgitter eines Militär-Waggons; mehrere Platten addieren sich, höchstens 80 %.
fire-armor-plate=Gegen Feuer: 2 flach, 6 % je Platte. Kommt ins Ausrüstungsgitter eines Militär-Waggons; mehrere Platten addieren sich, höchstens 80 %.
tungsten-carbide-armor-plate=Physisch 2 flach, 9 %; Säure 3 %; Feuer 4 % je Platte. Kommt ins Ausrüstungsgitter eines Militär-Waggons; mehrere Platten addieren sich, höchstens 80 %.
tungsten-reactive-armor-plate=Explosion 6 flach, 10 %; physisch 0,5 flach, 3 % je Platte. Kommt ins Ausrüstungsgitter eines Militär-Waggons; mehrere Platten addieren sich, höchstens 80 %.
tungsten-carbide-acid-armor-plate=Säure 2 flach, 12 %; Feuer 4 % je Platte. Kommt ins Ausrüstungsgitter eines Militär-Waggons; mehrere Platten addieren sich, höchstens 80 %.

