[entity-description]
gun-turret-wagon=Drei Maschinengewehre auf dem Dach. Sie schießen wie Geschütztürme, auch während der Zug fährt. Lege Magazine in den Waggon, die MGs laden aus seiner Ladung nach.
flamethrower-turret-wagon=Zwei Flammenwerfer auf dem Dach. Sie brennen wie Flammenwerfertürme, auch während der Zug fährt. Fülle den Waggon mit Rohöl, Schweröl oder Leichtöl.
rocket-turret-wagon=Zwei Raketenwerfer auf dem Dach. Sie feuern wie Raketentürme, auch während der Zug fährt. Lege Raketen in den Waggon, die Werfer laden aus seiner Ladung nach.
twin-cannon-wagon=Zwei Panzertürme auf dem Dach. Sie verschießen Panzergranaten wie ein Panzer, auch während der Zug fährt. Granaten in den Waggon legen, die Türme laden aus seiner Ladung nach.
howitzer-wagon=Ein Turm mit langem Rohr auf dem Dach. Er verschießt Panzergranaten weiter als ein Panzer, aber nicht auf Gegner in der Nähe, und schießt und dreht langsamer. Granaten in den Waggon legen, der Turm lädt aus seiner Ladung nach.
mine-launcher-wagon=Wirft Landminen bis zu 120 Felder weit, mindestens 16. Schießt nur dorthin, wohin die Minenwerfer-Fernsteuerung zeigt. Mit Wurfminen beladen.

