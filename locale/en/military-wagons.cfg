[technology-description]
gun-turret-wagon=A cargo wagon with three machine guns that defend the train on its way.
flamethrower-turret-wagon=A fluid wagon with two flamethrowers that defend the train on its way.
rocket-turret-wagon=A cargo wagon with two rocket launchers that defend the train on its way.
armor-steel=Steel alloyed with copper and carbon and quenched in water. Needed for armour plates on military wagons.
composite-armor-plate=Armour steel plates for the equipment grid of military wagons. They protect against physical damage.
twin-cannon-wagon=A cargo wagon with two tank turrets that defend the train on its way.
howitzer-wagon=A cargo wagon with a long-range howitzer turret that defends the train on its way.
mine-launcher-wagon=A wagon that lays minefields from afar, where the remote points.
reactive-armor-plate=Armour plates for military wagons that protect against explosions, also from the own rockets.
acid-armor-plate=Armour plates for military wagons that protect against spitters and worms.
fire-armor-plate=Armour plates for military wagons that protect against fire.
tungsten-armor-plates=Tungsten carbide and tungsten steel armour plates for military wagons: much stronger than the steel plates.

