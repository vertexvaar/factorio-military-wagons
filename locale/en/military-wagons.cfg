[item-description]
armor-steel=Quenched steel with copper and carbon. The base material of the wagon armour plates.
wagon-mine=A land mine with a propellant charge, for the mine launcher wagon. It lands armed.
mine-launcher-remote=Click on the map or the ground: a mine launcher wagon in range throws a mine there.
composite-armor-plate=Against physical damage: 0.5 flat, 4 % per plate. Goes into a military wagon's equipment grid; several plates add up, at most 80 %. Better quality: +30 % per level.
reactive-armor-plate=Against explosions: 1.5 flat, 5 % per plate. Goes into a military wagon's equipment grid; several plates add up, at most 80 %. Better quality: +30 % per level.
acid-armor-plate=Against acid: 0.5 flat, 5 % per plate. Goes into a military wagon's equipment grid; several plates add up, at most 80 %. Better quality: +30 % per level.
fire-armor-plate=Against fire: 1 flat, 5 % per plate. Goes into a military wagon's equipment grid; several plates add up, at most 80 %. Better quality: +30 % per level.
tungsten-carbide-armor-plate=Physical 1 flat, 6 %; acid 2 %; fire 3 % per plate. Goes into a military wagon's equipment grid; several plates add up, at most 80 %. Better quality: +30 % per level.
tungsten-reactive-armor-plate=Explosion 3 flat, 7 %; physical 2 % per plate. Goes into a military wagon's equipment grid; several plates add up, at most 80 %. Better quality: +30 % per level.
tungsten-carbide-acid-armor-plate=Acid 1 flat, 7 %; fire 3 % per plate. Goes into a military wagon's equipment grid; several plates add up, at most 80 %. Better quality: +30 % per level.

