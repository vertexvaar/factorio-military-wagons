[entity-description]
gun-turret-wagon=Three machine guns on the roof. They shoot like gun turrets, also while the train is moving. Put magazines into the wagon, the guns reload from its cargo.
flamethrower-turret-wagon=Two flamethrowers on the roof. They burn like flamethrower turrets, also while the train is moving. Fill the wagon with crude oil, heavy oil or light oil.
rocket-turret-wagon=Two rocket launchers on the roof. They fire like rocket turrets, also while the train is moving. Put rockets into the wagon, the launchers reload from its cargo.
twin-cannon-wagon=Two tank turrets on the roof. They fire tank shells like a tank, also while the train is moving. Put shells into the wagon, the turrets reload from its cargo.
howitzer-wagon=One long-barrelled turret on the roof. It fires tank shells further than a tank, but not at enemies close by, and fires and turns slower. Put shells into the wagon, the turret reloads from its cargo.
mine-launcher-wagon=Throws land mines up to 120 tiles away, at least 16. It only fires where the mine launcher remote points. Load it with thrown mines.

